[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auv-arena-mapper"
dynamic = ["version"]
description = "Desktop tool to design AUV pool arenas, place objects and plan waypoint missions."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["auv", "robotics", "sauvc", "waypoint", "mission-planning", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []  # standard library only (Tkinter)

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
auv-mapper = "auv_mapper.cli:main"

[project.gui-scripts]
auv-mapper-gui = "auv_mapper.cli:main"

[project.urls]
Homepage = "https://github.com/<your-user>/auv-arena-mapper"
Issues = "https://github.com/<your-user>/auv-arena-mapper/issues"
Changelog = "https://github.com/<your-user>/auv-arena-mapper/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "auv_mapper.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731", "E741"]  # lambdas for icon transforms; short loop names (l, I)

[tool.ruff.lint.per-file-ignores]
"src/auv_mapper/kinds.py" = ["E501"]   # data table
"src/auv_mapper/icons.py" = ["E501"]   # vector icon data
